<div class="avatarBase">
	<div *ngIf="this.volumeOpen" class="volumeslider" (mouseout)="openVolume(false)">
		<div class="volumeslider-1">
			<ion-range
				class="volumeSliderThingy"
				[(ngModel)]="settings.volume"
				(ionChange)="onVolumeChange()"
				color="light"
				max="{{ MAXVOLUME }}"
				min="0"
				step="1"
				pin="1"
			>
				<ion-icon slot="start" size="small" name="volume-high-outline"></ion-icon>
			</ion-range>
		</div>
	</div>
	<div class="avatar" [class.talking]="talking" (click)="openVolume()">
		<div class="avatar avatar-2">
			<img
				src="assets/avatar/players/{{ getColorId() }}-{{ isDead ? 'dead' : 'alive' }}.png"
				class="base no-drag-img"
				style="display: none"
				onload="this.style.display=''"
			/>
			<img
				*ngIf="!isDead && getSkinId() > 0"
				src="assets/avatar/skins/{{ getSkinId() }}.png"
				class="skin no-drag-img"
				style="display: none"
				onload="this.style.display=''"
				onerror="this.style.display='none'"
			/>
			<img
				*ngIf="!isDead && getRemoteSkinUrl()"
				[src]="getRemoteSkinUrl()"
				[ngStyle]="getSkinStyle()"
				class="skin remote-cosmetic no-drag-img"
				style="display: none"
				onload="this.style.display=''"
				onerror="this.style.display='none'"
			/>
			<img
				*ngIf="!isDead && getRemoteBackHatUrl()"
				[src]="getRemoteBackHatUrl()"
				[ngStyle]="getHatStyle()"
				class="hat remote-cosmetic backlayerd-hat no-drag-img"
				style="display: none"
				onload="this.style.display=''"
				onerror="this.style.display='none'"
			/>

			<!-- {overflow && <img src={coloredHats[`${hat}${color}`] || hats[hat]} ref={hatImg} className={classes.hat} />} -->
		</div>
		<img
			*ngIf="!isDead && getHatId() > 0"
			src="assets/avatar/hats/{{ getHatImage() }}.png"
			[style.top]="getHatY()"
			[class]="backLayerHats.has(getHatId()) ? 'backlayerd-hat' : ''"
			class="hat no-drag-img"
			style="display: none"
			onload="this.style.display=''"
			onerror="this.style.display='none'"
		/>
		<img
			*ngIf="!isDead && getRemoteHatUrl()"
			[src]="getRemoteHatUrl()"
			[ngStyle]="getHatStyle()"
			class="hat remote-cosmetic no-drag-img"
			style="display: none"
			onload="this.style.display=''"
			onerror="this.style.display='none'"
		/>
		<img
			*ngIf="!isDead && getRemoteVisorUrl()"
			[src]="getRemoteVisorUrl()"
			[ngStyle]="getVisorStyle()"
			class="visor remote-cosmetic no-drag-img"
			style="display: none"
			onload="this.style.display=''"
			onerror="this.style.display='none'"
		/>
	</div>
	<p class="playername_container">
		<span class="playername noselect">{{ getDisplayName() }}</span>
	</p>
</div>
