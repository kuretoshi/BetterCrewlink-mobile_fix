<div class="avatarBase">
	<div
		class="avatar"
		[class.talking]="talking"
		tabindex="0"
		role="button"
		[attr.aria-label]="settings ? player.name + 'の音量を調整' : player.name"
		(click)="openVolume($event)"
		(keyup.enter)="openVolume($event)"
	>
		<div class="avatar avatar-2">
			<div class="nos-body-mask" [style.mask-image]="getBodyMask()" [style.-webkit-mask-image]="getBodyMask()">
				<img
					[src]="getBodyImage()"
					class="base no-drag-img"
					style="display: none"
					onload="this.style.display = ''"
					(error)="onBodyImageError($event)"
					alt="{{ player.name }}"
				/>
			</div>
			@if (getSkin(); as skin) {
				<img
					[src]="skin.src"
					class="cosmetic no-drag-img"
					[style.top]="skin.top"
					[style.left]="skin.left"
					[style.width]="skin.width"
					[style.z-index]="skin.zIndex"
					style="display: none"
					onload="this.style.display = ''"
					onerror="this.style.display = 'none'"
					alt=""
				/>
			}
			<!-- Desktop 3.2.12: hats and visors are clipped to the same circle as the talking
			     border, so tall hats no longer spill outside the avatar. -->
			@if (getHatBack(); as hatBack) {
				<img
					[src]="hatBack.src"
					class="cosmetic no-drag-img"
					[style.top]="hatBack.top"
					[style.left]="hatBack.left"
					[style.width]="hatBack.width"
					[style.z-index]="hatBack.zIndex"
					style="display: none"
					onload="this.style.display = ''"
					onerror="this.style.display = 'none'"
					alt=""
				/>
			}
			@if (getHat(); as hat) {
				<img
					[src]="hat.src"
					class="cosmetic no-drag-img"
					[style.top]="hat.top"
					[style.left]="hat.left"
					[style.width]="hat.width"
					[style.z-index]="hat.zIndex"
					style="display: none"
					onload="this.style.display = ''"
					onerror="this.style.display = 'none'"
					alt=""
				/>
			}
			@if (getVisor(); as visor) {
				<img
					[src]="visor.src"
					class="cosmetic no-drag-img"
					[style.top]="visor.top"
					[style.left]="visor.left"
					[style.width]="visor.width"
					[style.z-index]="visor.zIndex"
					style="display: none"
					onload="this.style.display = ''"
					onerror="this.style.display = 'none'"
					alt=""
				/>
			}
		</div>

		@if (connectionIcon(); as icon) {
			<div
				class="connectionBadge noselect"
				[class.novoice]="connectionState === 'novoice'"
				role="img"
				[attr.aria-label]="connectionState === 'novoice' ? '音声未接続' : 'ボイスサーバー未接続'"
			>
				<img [src]="icon" class="no-drag-img" alt="" />
			</div>
		}
	</div>
</div>
@if (settings) {
	<ion-popover
		[isOpen]="volumeOpen"
		[event]="volumeEvent"
		reference="trigger"
		side="bottom"
		alignment="center"
		cssClass="player-volume-popover"
		(didDismiss)="closeVolume()"
	>
		<ng-template>
			<div class="player-volume-controls">
				<div class="player-volume-header">
					<span class="player-volume-name">{{ player.name }}</span>
					<span class="player-volume-value">{{ settings.volume }}%</span>
				</div>
				<div class="player-volume-row">
					<ion-range
						[(ngModel)]="settings.volume"
						(ionChange)="onVolumeChange()"
						[attr.aria-label]="player.name + 'の音量'"
						color="light"
						[max]="MAXVOLUME"
						min="0"
						step="1"
						pin="true"
					></ion-range>
					<ion-button
						fill="clear"
						[color]="settings.isMuted ? 'danger' : 'light'"
						[attr.aria-label]="settings.isMuted ? 'ミュート解除' : 'ミュート'"
						(click)="onMuteToggle()"
					>
						<ion-icon
							slot="icon-only"
							[name]="settings.isMuted ? 'volume-mute-outline' : 'volume-high-outline'"
						></ion-icon>
					</ion-button>
				</div>
			</div>
		</ng-template>
	</ion-popover>
}
