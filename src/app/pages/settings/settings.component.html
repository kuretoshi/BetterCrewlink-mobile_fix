<ion-content color="secondary">
	<div>
		<ion-list lines="full" class="ion-no-margin" style="background-color: #25232a">
			<ion-list-header lines="full" color="secondary">
				<ion-label fixed class="fixedLabel"> 接続設定 </ion-label>
			</ion-list-header>
			<ion-item>
				<ion-col size="5" class="settingLabelCol">
					<ion-label>ボイスサーバー</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-select text-wrap [(ngModel)]="getSettings().voiceServerOption" (ionChange)="onSettingsChange()">
						<ion-select-option [value]="1">Better-Crewlink</ion-select-option>
						<ion-select-option [value]="2">カスタムサーバー</ion-select-option>
					</ion-select>
				</ion-col>
			</ion-item>
			<ion-item color="secondary" *ngIf="getSettings().voiceServerOption === 2">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>カスタムサーバー</ion-label>
				</ion-col>
				<ion-col size="7">
					<ion-input
						[(ngModel)]="getSettings().customVoiceServer"
						(ionChange)="onSettingsChange()"
						placeholder="ボイスサーバーURL"
					></ion-input>
				</ion-col>
			</ion-item>
			<ion-item color="secondary">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>ゲーム内の名前</ion-label>
				</ion-col>
				<ion-col size="7">
					<ion-input
						[(ngModel)]="getSettings().username"
						(ionChange)="onSettingsChange()"
						placeholder="'Coochie Man'"
					></ion-input>
				</ion-col>
			</ion-item>
			<ion-item color="secondary">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>ロビーコード</ion-label>
				</ion-col>
				<ion-col size="7">
					<ion-input
						style="text-transform: uppercase"
						pattern="^[A-Za-z]{4}$|^[A-Za-z]{6}$"
						[(ngModel)]="getSettings().gamecode"
						(ionChange)="onSettingsChange()"
						placeholder="'ABCDEF'"
						maxlength="6"
					></ion-input>
				</ion-col>
			</ion-item>
			<ion-item *ngIf="getSettings().isMobile">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>オーバーレイを有効化</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-checkbox
						[(ngModel)]="getSettings().overlayEnabled"
						(ionChange)="onSettingsChange()"
						placeholder="オーバーレイを有効化"
					></ion-checkbox>
				</ion-col>
			</ion-item>
			<ion-item>
				<ion-col size="5" class="settingLabelCol">
					<ion-label>NAT FIX</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-checkbox
						[(ngModel)]="getSettings().natFix"
						(ionChange)="onSettingsChange()"
						placeholder="NAT FIX"
					></ion-checkbox>
				</ion-col>
			</ion-item>
			<ion-item>
				<ion-col size="5" class="settingLabelCol">
					<ion-label>ボイスエフェクト</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-range
						min="0"
						max="100"
						step="1"
						pin="true"
						[(ngModel)]="getSettings().voiceEffectStrength"
						(ionChange)="onSettingsChange()"
					></ion-range>
				</ion-col>
			</ion-item>
			<ion-item color="secondary">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>テスト時のエフェクト</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<div class="voice-test-toggle">
						<ion-toggle
							[(ngModel)]="voiceEffectTestEnabled"
							(ionChange)="updateVoiceEffectTest()"
						></ion-toggle>
						<span class="voice-test-label">ON</span>
					</div>
				</ion-col>
			</ion-item>
			<ion-item color="secondary">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>マイク</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-select
						[(ngModel)]="getSettings().selectedMicrophone"
						[compareWith]="compareFn"
						(ionChange)="onSettingsChange()"
						class="full-width-select"
					>
						<ion-select-option *ngFor="let microphone of gameHelper.microphones" [value]="microphone">
							{{ microphone.label }}</ion-select-option
						>
					</ion-select>
				</ion-col>
			</ion-item>
			<ion-item>
				<ion-col size="5" class="settingLabelCol">
					<ion-label>マイクテスト</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol voice-test-controls">
					<ion-button size="small" (click)="toggleVoiceEffectTest()">
						{{ isVoiceEffectTestRunning ? '停止' : 'テスト開始' }}
					</ion-button>
				</ion-col>
			</ion-item>
			<ion-item *ngIf="isVoiceEffectTestRunning">
				<ion-col size="5" class="settingLabelCol">
					<ion-label>テスト音量</ion-label>
				</ion-col>
				<ion-col size="7" class="settingInputCol">
					<ion-range
						min="0"
						max="100"
						step="1"
						pin="true"
						[(ngModel)]="voiceEffectTestVolume"
						(ionChange)="updateVoiceEffectTest()"
					></ion-range>
				</ion-col>
			</ion-item>
			<ion-item color="secondary" *ngIf="voiceEffectTestError">
				<ion-label color="danger">{{ voiceEffectTestError }}</ion-label>
			</ion-item>
			<hr />
			<ng-container [ngSwitch]="gameHelper.cManager.connectionState">
				<ng-container *ngSwitchDefault>
					<ion-item color="secondary">
						<ion-button (click)="gameHelper.connect()" [routerLink]="['/game']">接続</ion-button>
					</ion-item>
				</ng-container>
				<ng-container *ngSwitchCase="1 || 2">
					<ion-item color="secondary">
						<ion-button (click)="gameHelper.connect()">再読み込み</ion-button>
						<ion-button (click)="gameHelper.disconnect()">切断</ion-button>
					</ion-item>
				</ng-container>
			</ng-container>
		</ion-list>
	</div>
</ion-content>
